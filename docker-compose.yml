services:
  mysql:
    image: mysql:8.4
    container_name: n01sport-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: n01sport
      MYSQL_USER: n01sport_user
      MYSQL_PASSWORD: N01Sport@123
      MYSQL_ROOT_PASSWORD: Root@123456
      TZ: Asia/Ho_Chi_Minh
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - n01sport_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-pRoot@123456"]
      interval: 5s
      timeout: 5s
      retries: 20

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: n01sport-phpmyadmin
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
    ports:
      - "127.0.0.1:8080:80"

volumes:
  n01sport_mysql_data:
