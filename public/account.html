<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Tài khoản và vận hành | N01SPORT</title>
    <meta name="robots" content="noindex" />
    <link rel="icon" href="/favicon.svg" />
    <link rel="stylesheet" href="/css/portal.css" />
  </head>
  <body>
    <a class="skip" href="#content">Đến nội dung</a>
    <header class="topbar">
      <a class="logo" href="/">N<span>01</span>SPORT</a
      ><a href="/#courts">Tìm sân</a><span id="identity"></span
      ><button id="logout" class="quiet" hidden>Đăng xuất</button>
    </header>
    <div class="workspace">
      <aside>
        <p class="eyebrow">KHÔNG GIAN CỦA BẠN</p>
        <nav id="navigation" aria-label="Chức năng tài khoản"></nav>
        <p class="sidebar-note">Lịch rõ ràng.<br />Trải nghiệm trọn vẹn.</p>
        <a href="/policies.html">Điều khoản & quyền riêng tư</a>
      </aside>
      <main id="content" tabindex="-1">
        <div class="page-heading">
          <div>
            <p class="eyebrow">N01SPORT / TÀI KHOẢN</p>
            <h1 id="title">Đang tải…</h1>
            <p id="subtitle"></p>
          </div>
          <div id="actions" class="actions"></div>
        </div>
        <div id="view" aria-busy="true"></div>
      </main>
    </div>
    <dialog id="editor">
      <form id="editor-form">
        <div class="dialog-heading">
          <h2 id="editor-title"></h2>
          <button
            type="button"
            id="close-editor"
            class="quiet"
            aria-label="Đóng"
          >
            Đóng
          </button>
        </div>
        <p id="form-error" role="alert" tabindex="-1" hidden></p>
        <div id="fields" class="form-grid"></div>
        <div class="form-actions">
          <button type="button" id="cancel-editor" class="quiet">Hủy</button
          ><button type="submit" class="primary">Lưu thông tin</button>
        </div>
      </form>
    </dialog>
    <div id="toast" role="status" aria-live="polite" hidden></div>
    <script type="module" src="/js/portal.js?v=walk-in-2"></script>
  </body>
</html>
