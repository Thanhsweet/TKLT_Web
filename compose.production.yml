x-app: &app
  build: .
  restart: unless-stopped
  init: true
  environment: &appenv
    NODE_ENV: production
    HOST: 0.0.0.0
    PORT: 3000
    PUBLIC_URL: https://${DOMAIN:?Set DOMAIN}
    DB_HOST: mysql
    DB_PORT: 3306
    DB_NAME: ${DB_NAME:-n01sport}
    DB_USER: ${DB_USER:-n01sport_user}
    DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
    PAYMENT_MODE: bank_transfer
    TRUST_PROXY: "1"
    SESSION_HOURS: "24"
    BOOKING_HOLD_MINUTES: "10"
    SEPAY_WEBHOOK_KEY: ${SEPAY_WEBHOOK_KEY:?Set SEPAY_WEBHOOK_KEY}
    SMTP_HOST: ${SMTP_HOST:-}
    SMTP_PORT: ${SMTP_PORT:-587}
    SMTP_SECURE: ${SMTP_SECURE:-false}
    SMTP_USER: ${SMTP_USER:-}
    SMTP_PASSWORD: ${SMTP_PASSWORD:-}
    SMTP_FROM: ${SMTP_FROM:-}
    MYSQLDUMP_FLAVOR: mariadb
    BACKUP_DIR: /app/var/backups
    TZ: Asia/Ho_Chi_Minh
  volumes:
    - uploads:/app/public/uploads
    - backups:/app/var/backups
  depends_on:
    mysql:
      condition: service_healthy
  networks: [private]

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME:-n01sport}
      MYSQL_USER: ${DB_USER:-n01sport_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD}
      TZ: Asia/Ho_Chi_Minh
    volumes: ["database:/var/lib/mysql"]
    command: ["--default-time-zone=+07:00"]
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'mysqladmin ping -h localhost -uroot -p"$$MYSQL_ROOT_PASSWORD" --silent',
        ]
      interval: 10s
      timeout: 5s
      retries: 20
    networks: [private]
  app:
    <<: *app
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
  worker:
    <<: *app
    command: ["node", "scripts/worker.js"]
  proxy:
    image: caddy:2
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN}
      TLS_EMAIL: ${TLS_EMAIL:?Set TLS_EMAIL}
    ports: ["80:80", "443:443", "443:443/udp"]
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [app]
    networks: [private]
networks:
  private:
volumes:
  database:
  uploads:
  backups:
  caddy_data:
  caddy_config:
